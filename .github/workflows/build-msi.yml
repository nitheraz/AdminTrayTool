name: Build MSI

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest

    steps:

    # ========================================
    # Checkout
    # ========================================
    - name: Checkout
      uses: actions/checkout@v4


    # ========================================
    # Setup .NET 10
    # ========================================
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'


    # ========================================
    # Restore
    # ========================================
    - name: Restore NuGet
      run: dotnet restore


    # ========================================
    # Build
    # ========================================
    - name: Build Release
      run: dotnet build -c Release --no-restore


    # ========================================
    # Publish
    # ========================================
    - name: Publish win-x64
      run: |
        dotnet publish `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -o publish


    # ========================================
    # Copy config.json
    # ========================================
    - name: Copy config.json
      shell: powershell
      run: |

        $src = "$PWD\config.json"
        $dst = "$PWD\publish\config.json"

        if (Test-Path $src) {

          Copy-Item `
            -Path $src `
            -Destination $dst `
            -Force

          Write-Host "config.json copied to publish folder."

        }
        else {

          Write-Host "WARNING: config.json was not found."

        }


    # ========================================
    # Verify GAM7
    # ========================================
    - name: Verify GAM7
      shell: powershell
      run: |

        $gamPath = "$PWD\GAM7"

        Write-Host "========================================"
        Write-Host "Checking GAM7"
        Write-Host "========================================"

        Write-Host "GAM7 path:"
        Write-Host $gamPath

        if (-not (Test-Path $gamPath)) {

          Write-Host "ERROR: GAM7 folder was not found."
          exit 1

        }

        $gamExe = "$gamPath\gam.exe"

        if (-not (Test-Path $gamExe)) {

          Write-Host "ERROR: gam.exe was not found."
          exit 1

        }

        Write-Host "GAM7 found successfully."

        Write-Host ""
        Write-Host "gam.exe:"
        Write-Host $gamExe

        Write-Host ""
        Write-Host "GAM7 file count:"

        $gamFiles = Get-ChildItem `
          -Path $gamPath `
          -Recurse `
          -File

        Write-Host $gamFiles.Count


    # ========================================
    # Prepare MSI application source
    #
    # IMPORTANT:
    # publish contains GAM7 because the
    # project copies it during publish.
    #
    # We remove GAM7 from the application
    # harvest source so GAM7 is harvested
    # separately.
    # ========================================
    - name: Prepare MSI application source
      shell: powershell
      run: |

        $appSourceDir = "$PWD\AppSourceDir"

        Write-Host "========================================"
        Write-Host "Preparing AppSourceDir"
        Write-Host "========================================"

        if (Test-Path $appSourceDir) {

          Remove-Item `
            -Path $appSourceDir `
            -Recurse `
            -Force

        }

        New-Item `
          -ItemType Directory `
          -Force `
          -Path $appSourceDir |
          Out-Null

        # Copy published application.
        Copy-Item `
          -Path "$PWD\publish\*" `
          -Destination $appSourceDir `
          -Recurse `
          -Force

        # Remove GAM7 from the application
        # harvest source.
        $appGamPath = "$appSourceDir\GAM7"

        if (Test-Path $appGamPath) {

          Remove-Item `
            -Path $appGamPath `
            -Recurse `
            -Force

          Write-Host "Removed GAM7 from AppSourceDir."

        }

        Write-Host ""
        Write-Host "Application source prepared."


    # ========================================
    # Verify application source
    # ========================================
    - name: Verify application source
      shell: powershell
      run: |

        Write-Host "========================================"
        Write-Host "Application Source"
        Write-Host "========================================"

        Get-ChildItem `
          -Path "$PWD\AppSourceDir" `
          -Recurse |
          ForEach-Object {

            Write-Host $_.FullName

          }

        Write-Host ""
        Write-Host "Checking that GAM7 is NOT present..."

        if (Test-Path "$PWD\AppSourceDir\GAM7") {

          Write-Host "ERROR: GAM7 still exists in AppSourceDir."
          exit 1

        }

        Write-Host "Confirmed: GAM7 is excluded from application harvest."


    # ========================================
    # Create installer output directory
    # ========================================
    - name: Create installer output directory
      shell: powershell
      run: |

        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$PWD\installer-output" |
          Out-Null

        Write-Host "installer-output directory created."


    # ========================================
    # Create portable ZIP
    #
    # IMPORTANT:
    # This uses publish, not AppSourceDir.
    #
    # Therefore the portable ZIP still
    # contains GAM7.
    # ========================================
    - name: Create portable ZIP
      shell: powershell
      run: |

        $zip = "$PWD\installer-output\AdminTrayTool-portable.zip"

        if (Test-Path $zip) {

          Remove-Item `
            -Path $zip `
            -Force

        }

        Compress-Archive `
          -Path "$PWD\publish\*" `
          -DestinationPath $zip `
          -Force

        if (-not (Test-Path $zip)) {

          Write-Host "ERROR: Portable ZIP was not created."
          exit 1

        }

        Write-Host "Portable ZIP created successfully."


    # ========================================
    # Locate WiX Toolset
    # ========================================
    - name: Locate WiX Toolset
      shell: powershell
      run: |

        Write-Host "Searching for WiX Toolset..."

        $candle = Get-ChildItem `
          -Path "C:\Program Files (x86)" `
          -Filter "candle.exe" `
          -Recurse `
          -ErrorAction SilentlyContinue |
          Select-Object -First 1

        if (-not $candle) {

          $candle = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "candle.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

        }

        if (-not $candle) {

          Write-Host "ERROR: candle.exe was not found."
          exit 1

        }

        $wix = $candle.Directory.FullName

        Write-Host ""
        Write-Host "WiX Toolset found at:"
        Write-Host $wix

        $required = @(
          "candle.exe",
          "light.exe",
          "heat.exe"
        )

        foreach ($file in $required) {

          $path = Join-Path $wix $file

          if (-not (Test-Path $path)) {

            Write-Host "ERROR: $file was not found."
            exit 1

          }

          Write-Host "Found: $path"

        }

        "WIX_PATH=$wix" |
          Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

        Write-Host ""
        Write-Host "WiX Toolset is ready."


        # ========================================
    # Harvest application
    # ========================================
    - name: Harvest application with Heat
      shell: powershell
      run: |

        $wix = "$env:WIX_PATH"

        Write-Host "Harvesting application files..."

        if (-not (Test-Path "$PWD\publish")) {
          Write-Host "ERROR: publish folder does not exist."
          exit 1
        }

        & "$wix\heat.exe" `
          dir "$PWD\publish" `
          -cg AppFiles `
          -dr INSTALLFOLDER `
          -gg `
          -sfrag `
          -srd `
          -sreg `
          -var var.SourceDir `
          -out "$PWD\installer\components.wxs"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: Application Heat failed."
          exit $LASTEXITCODE
        }

        if (-not (Test-Path "$PWD\installer\components.wxs")) {
          Write-Host "ERROR: components.wxs was not created."
          exit 1
        }

        Write-Host "Application components.wxs created."


    # ========================================
    # Harvest GAM7
    #
    # GAM7 is harvested independently.
    # ========================================
    - name: Harvest GAM7 with Heat
      shell: powershell
      run: |

        $wix = "$env:WIX_PATH"

        Write-Host "========================================"
        Write-Host "Harvesting GAM7"
        Write-Host "========================================"

        & "$wix\heat.exe" `
          dir "$PWD\GAM7" `
          -cg GAM7Files `
          -dr GAM7Folder `
          -gg `
          -sfrag `
          -srd `
          -var var.GAM7SourceDir `
          -out "$PWD\installer\GAM7Components.wxs"

        if ($LASTEXITCODE -ne 0) {

          Write-Host "ERROR: GAM7 Heat failed."
          exit $LASTEXITCODE

        }

        if (-not (Test-Path "$PWD\installer\GAM7Components.wxs")) {

          Write-Host "ERROR: GAM7Components.wxs was not created."
          exit 1

        }

        Write-Host "GAM7Components.wxs created successfully."


    # ========================================
    # Verify harvested files
    # ========================================
    - name: Verify harvested WiX files
      shell: powershell
      run: |

        Write-Host "========================================"
        Write-Host "Verifying harvested WiX files"
        Write-Host "========================================"

        Write-Host ""
        Write-Host "Application components:"
        Write-Host "$PWD\installer\components.wxs"

        Write-Host ""
        Write-Host "GAM7 components:"
        Write-Host "$PWD\installer\GAM7Components.wxs"

        # Make sure application harvest
        # does NOT contain GAM7 paths.
        $appComponents = Get-Content `
          "$PWD\installer\components.wxs" `
          -Raw

        if ($appComponents -match "\\GAM7\\") {

          Write-Host "ERROR: GAM7 was found in components.wxs."
          exit 1

        }

        Write-Host "Confirmed: application harvest does not contain GAM7."


    # ========================================
    # Determine MSI version
    # ========================================
    - name: Determine MSI version
      shell: powershell
      run: |

        if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {

          $version = $Matches[1]

        }
        else {

          $version = "1.0.0"

        }

        Write-Host "MSI Version: $version"

        "MSI_VERSION=$version" |
          Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8


    # ========================================
    # Build MSI
    # ========================================
    - name: Build MSI with WiX
      shell: powershell
      run: |

        $wix = "$env:WIX_PATH"
        $outputDir = "$PWD\installer-output"

        Write-Host "========================================"
        Write-Host "Building MSI"
        Write-Host "========================================"

        Write-Host ""
        Write-Host "Using WiX:"
        Write-Host $wix

        Write-Host ""
        Write-Host "Compiling WiX source files..."

        & "$wix\candle.exe" `
          -dSourceDir="$PWD\AppSourceDir" `
          -dGAM7SourceDir="$PWD\GAM7" `
          -dAdminTrayToolOutputDir="$PWD\publish" `
          -dProductVersion="$env:MSI_VERSION" `
          -out "$outputDir\" `
          "installer\Product.wxs" `
          "installer\components.wxs" `
          "installer\GAM7Components.wxs"

        if ($LASTEXITCODE -ne 0) {

          Write-Host "ERROR: WiX candle.exe failed."
          exit $LASTEXITCODE

        }

        Write-Host "WiX compilation successful."

        $productObj = "$outputDir\Product.wixobj"
        $componentsObj = "$outputDir\components.wixobj"
        $gamObj = "$outputDir\GAM7Components.wixobj"

        if (-not (Test-Path $productObj)) {

          Write-Host "ERROR: Product.wixobj was not created."
          exit 1

        }

        if (-not (Test-Path $componentsObj)) {

          Write-Host "ERROR: components.wixobj was not created."
          exit 1

        }

        if (-not (Test-Path $gamObj)) {

          Write-Host "ERROR: GAM7Components.wixobj was not created."
          exit 1

        }

        Write-Host ""
        Write-Host "Linking MSI..."

        & "$wix\light.exe" `
          -ext WixUtilExtension `
          -ext WixUIExtension `
          -out "$outputDir\AdminTrayTool.msi" `
          "$productObj" `
          "$componentsObj" `
          "$gamObj"

        if ($LASTEXITCODE -ne 0) {

          Write-Host "ERROR: WiX light.exe failed."
          exit $LASTEXITCODE

        }

        $msi = "$outputDir\AdminTrayTool.msi"

        if (-not (Test-Path $msi)) {

          Write-Host "ERROR: AdminTrayTool.msi was not created."
          exit 1

        }

        Write-Host ""
        Write-Host "========================================"
        Write-Host "MSI created successfully!"
        Write-Host "========================================"
        Write-Host $msi


    # ========================================
    # Upload MSI artifact
    # ========================================
    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-msi
        path: installer-output/AdminTrayTool.msi


    # ========================================
    # Upload portable ZIP artifact
    # ========================================
    - name: Upload portable ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-portable
        path: installer-output/AdminTrayTool-portable.zip


    # ========================================
    # Upload published application
    # ========================================
    - name: Upload published application
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-publish
        path: publish


    # ========================================
    # Create GitHub Release
    # ========================================
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          installer-output/AdminTrayTool.msi
          installer-output/AdminTrayTool-portable.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}