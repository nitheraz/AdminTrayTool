name: Build MSI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '7.0.x'

    - name: Restore NuGet
      run: dotnet restore

    - name: Build (Release)
      run: dotnet build -c Release --no-restore

    - name: Publish self-contained (win-x64)
      run: |
        dotnet publish -c Release -r win-x64 --self-contained false -o publish

    - name: Copy sample config.json into publish (for portable ZIP and installer)
      shell: powershell
      run: |
        $src = "$PWD\config.json"
        $dst = "$PWD\publish\config.json"
        if (Test-Path $src) { Copy-Item -Path $src -Destination $dst -Force }

    - name: Create portable ZIP
      shell: powershell
      run: |
        $zip = "$PWD\installer-output\AdminTrayTool-portable.zip"
        if (Test-Path $zip) { Remove-Item $zip }
        Compress-Archive -Path "$PWD\publish\*" -DestinationPath $zip -Force

    - name: Install WiX Toolset (choco)
      shell: powershell
      run: |
        choco install wixtoolset -y --no-progress
        refreshenv

    - name: Create installer output dir
      run: mkdir installer-output

    - name: Harvest publish folder with Heat (generate components.wxs)
      shell: powershell
      env:
        WIX_PATH: C:\Program Files (x86)\WiX Toolset v3.11\bin
      run: |
        $wix = "$env:WIX_PATH"
        if (-not (Test-Path $wix)) { Write-Host "WiX not found at $wix"; exit 1 }

        # Use heat to harvest the publish folder into components.wxs so installer keeps in sync with built files
        & "$wix\heat.exe" dir "$PWD\publish" -cg AppFiles -dr INSTALLFOLDER -gg -sfrag -srd -var var.SourceDir -out "installer\components.wxs"

    - name: Build MSI with WiX (candle & light)
      shell: powershell
      env:
        WIX_PATH: C:\Program Files (x86)\WiX Toolset v3.11\bin
      run: |
        $wix = "$env:WIX_PATH"
        if (-not (Test-Path $wix)) { Write-Host "WiX not found at $wix"; exit 1 }

        # compile .wxs -> .wixobj (Product and harvested components)
        & "$wix\candle.exe" -dSourceDir="$PWD\publish" "installer\Product.wxs" "installer\components.wxs" -out "installer-output\Product.wixobj"

        # link .wixobj -> .msi (include Util extension for permission setting)
        & "$wix\light.exe" -ext WixUtilExtension -out "installer-output\AdminTrayTool.msi" "installer-output\Product.wixobj"

    - name: Sign MSI (optional)
      if: ${{ env.CERT_PFX != '' && env.CERT_PASSWORD != '' }}
      shell: powershell
      env:
        CERT_PFX: ${{ secrets.CERT_PFX }}
        CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
      run: |
        # CERT_PFX should be provided as base64-encoded PFX content in the secret
        $pfxBytes = [System.Convert]::FromBase64String($env:CERT_PFX)
        $pfxPath = "$PWD\installer-output\codesign.pfx"
        [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

        $msi = "$PWD\installer-output\AdminTrayTool.msi"
        if (-not (Test-Path $msi)) { Write-Host "MSI not found at $msi"; exit 1 }

        # Sign the MSI using signtool (assumes signtool available on runner)
        & signtool sign /fd SHA256 /f $pfxPath /p $env:CERT_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 /v $msi

    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-msi
        path: installer-output/AdminTrayTool.msi

    - name: Create GitHub Release and upload artifacts
      uses: softprops/action-gh-release@v1
      with:
        files: |
          installer-output/AdminTrayTool.msi
          installer-output/AdminTrayTool-portable.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create draft release notes file
      if: always()
      run: |
        $tag = "v$(Get-Date -Format yyyyMMddHHmmss)"
        $body = "Release $tag - autogenerated\n\nSee attached artifacts: AdminTrayTool.msi, AdminTrayTool-portable.zip\n"
        echo $body > release-notes.txt

    - name: Upload release notes artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-notes
        path: release-notes.txt

    - name: Upload published app (zip)
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-publish
        path: |
          publish
          installer-output/AdminTrayTool-portable.zip
