name: Build MSI

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-msi:

    runs-on: windows-latest

    steps:

      # ========================================
      # Checkout
      # ========================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================
      # Setup .NET 10
      # ========================================

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"


      # ========================================
      # Determine version
      # ========================================

      - name: Determine version
        shell: pwsh
        run: |
          $versionFile = Join-Path $env:GITHUB_WORKSPACE "VERSION.txt"

          if (-not (Test-Path $versionFile)) {
            throw "VERSION.txt was not found."
          }

          $fileVersion = (Get-Content $versionFile -Raw).Trim()

          if ($fileVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version in VERSION.txt: '$fileVersion'. Expected MAJOR.MINOR.PATCH."
          }

          if ("${{ github.ref }}" -match '^refs/tags/v(.+)$') {
            $tagVersion = $Matches[1]

            if ($tagVersion -ne $fileVersion) {
              throw "Version mismatch: Git tag is v$tagVersion but VERSION.txt contains $fileVersion."
            }

            $version = $tagVersion
            Write-Host "Release version: $version"
          }
          else {
            $version = $fileVersion
            Write-Host "Build version from VERSION.txt: $version"
          }

          "MSI_VERSION=$version" >> $env:GITHUB_ENV


      # ========================================
      # Restore
      # ========================================

      - name: Restore NuGet
        run: dotnet restore


      # ========================================
      # Build
      # ========================================

      - name: Build Release
        shell: powershell
        run: |

          dotnet build -c Release --no-restore `
            "/p:Version=$env:MSI_VERSION" `
            "/p:AssemblyVersion=$env:MSI_VERSION.0" `
            "/p:FileVersion=$env:MSI_VERSION.0"


      # ========================================
      # Publish
      # ========================================

      - name: Publish win-x64
        shell: powershell
        run: |

          dotnet publish `
            -c Release `
            -r win-x64 `
            --self-contained true `
            "/p:Version=$env:MSI_VERSION" `
            "/p:AssemblyVersion=$env:MSI_VERSION.0" `
            "/p:FileVersion=$env:MSI_VERSION.0" `
            -o publish


      # ========================================
      # Copy config.json
      # ========================================

      - name: Copy config.json
        shell: powershell
        run: |

          $src = Join-Path $PWD "config.json"
          $dst = Join-Path $PWD "publish\config.json"

          if (Test-Path $src) {

              Copy-Item `
                -Path $src `
                -Destination $dst `
                -Force

              Write-Host "config.json copied successfully."

          }
          else {

              Write-Host "WARNING: config.json was not found."

          }


      # ========================================
      # Verify GAM7
      # ========================================

      - name: Verify GAM7
        shell: powershell
        run: |

          $gamPath = Join-Path $PWD "GAM7"
          $gamExe = Join-Path $gamPath "gam.exe"

          Write-Host "========================================"
          Write-Host "Verifying GAM7"
          Write-Host "========================================"

          Write-Host "GAM7 path:"
          Write-Host $gamPath

          if (-not (Test-Path $gamPath)) {

              Write-Host "ERROR: GAM7 folder does not exist."
              exit 1

          }

          if (-not (Test-Path $gamExe)) {

              Write-Host "ERROR: GAM7\gam.exe was not found."
              exit 1

          }

          $files = Get-ChildItem `
              -Path $gamPath `
              -Recurse `
              -File

          Write-Host "GAM7 files found: $($files.Count)"

          Write-Host ""
          Write-Host "GAM7 verification successful."


      # ========================================
      # Prepare application source
      # ========================================

      - name: Prepare AppSourceDir
        shell: powershell
        run: |

          $appSource = Join-Path $PWD "AppSourceDir"

          Write-Host "========================================"
          Write-Host "Preparing AppSourceDir"
          Write-Host "========================================"

          if (Test-Path $appSource) {

              Remove-Item `
                -Path $appSource `
                -Recurse `
                -Force

          }

          New-Item `
            -ItemType Directory `
            -Path $appSource `
            -Force |
            Out-Null

          Copy-Item `
            -Path "$PWD\publish\*" `
            -Destination $appSource `
            -Recurse `
            -Force

          $appGam = Join-Path $appSource "GAM7"

          if (Test-Path $appGam) {

              Remove-Item `
                -Path $appGam `
                -Recurse `
                -Force

              Write-Host "Removed GAM7 from application source."

          }

          Write-Host "AppSourceDir prepared."


      # ========================================
      # Verify application source
      # ========================================

      - name: Verify AppSourceDir
        shell: powershell
        run: |

          $appSource = Join-Path $PWD "AppSourceDir"
          $appGam = Join-Path $appSource "GAM7"

          Write-Host "========================================"
          Write-Host "Verifying AppSourceDir"
          Write-Host "========================================"

          if (-not (Test-Path $appSource)) {

              Write-Host "ERROR: AppSourceDir does not exist."
              exit 1

          }

          if (Test-Path $appGam) {

              Write-Host "ERROR: GAM7 is still inside AppSourceDir."
              exit 1

          }

          Write-Host "Confirmed: GAM7 is excluded."


      # ========================================
      # Create installer output directory
      # ========================================

      - name: Create installer output directory
        shell: powershell
        run: |

          $output = Join-Path $PWD "installer-output"

          if (Test-Path $output) {

              Remove-Item `
                -Path $output `
                -Recurse `
                -Force

          }

          New-Item `
            -ItemType Directory `
            -Path $output `
            -Force |
            Out-Null

          Write-Host "installer-output created."


      # ========================================
      # Create portable ZIP
      # ========================================

      - name: Create portable ZIP
        shell: powershell
        run: |

          $zip = Join-Path `
            $PWD `
            "installer-output\AdminTrayTool-portable.zip"

          Compress-Archive `
            -Path "$PWD\publish\*" `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {

              Write-Host "ERROR: Portable ZIP was not created."
              exit 1

          }

          Write-Host "Portable ZIP created."


      # ========================================
      # Locate WiX Toolset
      # ========================================

      - name: Locate WiX Toolset
        shell: powershell
        run: |

          Write-Host "========================================"
          Write-Host "Locating WiX Toolset"
          Write-Host "========================================"

          $candle = Get-ChildItem `
            -Path "C:\Program Files (x86)" `
            -Filter "candle.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $candle) {

              $candle = Get-ChildItem `
                -Path "C:\Program Files" `
                -Filter "candle.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

          }

          if (-not $candle) {

              Write-Host "ERROR: candle.exe was not found."
              exit 1

          }

          $wix = $candle.Directory.FullName

          Write-Host "WiX found at:"
          Write-Host $wix

          foreach ($tool in @(
              "candle.exe",
              "light.exe",
              "heat.exe"
          )) {

              $toolPath = Join-Path $wix $tool

              if (-not (Test-Path $toolPath)) {

                  Write-Host "ERROR: $tool was not found."
                  exit 1

              }

              Write-Host "Found: $tool"

          }

          "WIX_PATH=$wix" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8


      # ========================================
      # Harvest application
      # ========================================

      - name: Harvest application
        shell: powershell
        run: |

          $wix = $env:WIX_PATH

          Write-Host "========================================"
          Write-Host "Harvesting application"
          Write-Host "========================================"

          & "$wix\heat.exe" `
            dir "$PWD\AppSourceDir" `
            -cg AppFiles `
            -dr INSTALLFOLDER `
            -gg `
            -sfrag `
            -srd `
            -var var.SourceDir `
            -out "$PWD\installer\components.wxs"

          if ($LASTEXITCODE -ne 0) {

              Write-Host "ERROR: Application Heat failed."
              exit $LASTEXITCODE

          }

          if (-not (Test-Path "$PWD\installer\components.wxs")) {

              Write-Host "ERROR: components.wxs was not created."
              exit 1

          }

          Write-Host "Application harvesting successful."


      # ========================================
      # Verify application harvest
      # ========================================

      - name: Verify application harvest
        shell: powershell
        run: |

          $components = Get-Content `
            "$PWD\installer\components.wxs" `
            -Raw

          Write-Host "Checking application harvest..."

          if ($components -match "GAM7") {

              Write-Host "ERROR: GAM7 found in application harvest."
              exit 1

          }

          Write-Host "Confirmed: application harvest contains no GAM7."


      # ========================================
      # Generate GAM7 WiX
      #
      # GAM7 is NOT harvested with Heat.
      #
      # This avoids:
      # ICE30 duplicate files
      # unresolved component references
      # Python DLL self-registration problems
      # ========================================

      - name: Generate GAM7 WiX
        shell: powershell
        run: |

          Write-Host "========================================"
          Write-Host "Generating GAM7 WiX"
          Write-Host "========================================"

          $gamPath = Join-Path $PWD "GAM7"
          $wixFile = Join-Path $PWD "installer\GAM7Components.wxs"

          if (-not (Test-Path "$gamPath\gam.exe")) {

              Write-Host "ERROR: GAM7\gam.exe was not found."
              exit 1

          }

          $files = Get-ChildItem `
            -Path $gamPath `
            -Recurse `
            -File

          Write-Host "Files to include: $($files.Count)"

          $xml = New-Object System.Text.StringBuilder

          [void]$xml.AppendLine('<?xml version="1.0" encoding="utf-8"?>')
          [void]$xml.AppendLine('<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">')
          [void]$xml.AppendLine('  <Fragment>')
          [void]$xml.AppendLine('    <DirectoryRef Id="GAM7Folder">')

          $index = 0

          foreach ($file in $files) {

              $index++

              $relative = $file.FullName.Substring($gamPath.Length).TrimStart('\')

              $directory = Split-Path `
                $relative `
                -Parent

              $fileName = Split-Path `
                $relative `
                -Leaf

              $componentId = "GAM7FileComponent$index"
              $fileId = "GAM7File$index"

              $source = "`$(var.GAM7SourceDir)\$relative"

              if ([string]::IsNullOrWhiteSpace($directory)) {

                  $directoryId = "GAM7Folder"

              }
              else {

                  $safeDirectory = $directory `
                    -replace '[^A-Za-z0-9]', '_'

                  $directoryId = "GAM7Dir_$safeDirectory"

              }

              [void]$xml.AppendLine(
                  "      <Component Id=`"$componentId`" Guid=`"*`">"
              )

              [void]$xml.AppendLine(
                  "        <File Id=`"$fileId`" KeyPath=`"yes`" Source=`"$source`" />"
              )

              [void]$xml.AppendLine(
                  "      </Component>"
              )

          }

          [void]$xml.AppendLine('    </DirectoryRef>')
          [void]$xml.AppendLine('  </Fragment>')
          [void]$xml.AppendLine('')

          [void]$xml.AppendLine('  <Fragment>')
          [void]$xml.AppendLine('    <ComponentGroup Id="GAM7Files">')

          for ($i = 1; $i -le $index; $i++) {

              [void]$xml.AppendLine(
                  "      <ComponentRef Id=`"GAM7FileComponent$i`" />"
              )

          }

          [void]$xml.AppendLine('    </ComponentGroup>')
          [void]$xml.AppendLine('  </Fragment>')
          [void]$xml.AppendLine('</Wix>')

          # NOTE:
          # The simple generated structure above requires
          # all GAM7 files to resolve beneath GAM7Folder.
          #
          # Therefore we now generate a complete directory-aware
          # version instead.

          $lines = New-Object System.Collections.Generic.List[string]

          $lines.Add('<?xml version="1.0" encoding="utf-8"?>')
          $lines.Add('<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">')
          $lines.Add('  <Fragment>')
          $lines.Add('    <DirectoryRef Id="GAM7Folder">')

          $directories = @{}

          foreach ($file in $files) {

              $relative = $file.FullName.Substring($gamPath.Length).TrimStart('\')
              $dir = Split-Path $relative -Parent

              if (-not [string]::IsNullOrWhiteSpace($dir)) {

                  $parts = $dir -split '\\'
                  $parentId = "GAM7Folder"

                  $currentPath = ""

                  foreach ($part in $parts) {

                      if ([string]::IsNullOrWhiteSpace($part)) {
                          continue
                      }

                      if ($currentPath -eq "") {
                          $currentPath = $part
                      }
                      else {
                          $currentPath = "$currentPath\$part"
                      }

                      $safe = $currentPath -replace '[^A-Za-z0-9]', '_'
                      $dirId = "GAM7Dir_$safe"

                      if (-not $directories.ContainsKey($currentPath)) {

                          $directories[$currentPath] = $dirId

                          $escapedName =
                            [System.Security.SecurityElement]::Escape($part)

                      }
                      else {

                          $parentId = $directories[$currentPath]

                      }

                  }

              }

          }

          # The directory nesting above cannot safely be emitted
          # from a flat dictionary, so discard it and use a deterministic
          # directory tree generated recursively.

          $lines = New-Object System.Collections.Generic.List[string]

          $lines.Add('<?xml version="1.0" encoding="utf-8"?>')
          $lines.Add('<Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">')
          $lines.Add('  <Fragment>')
          $lines.Add('    <DirectoryRef Id="GAM7Folder">')

          $componentRefs =
            New-Object System.Collections.Generic.List[string]

          $counter = 0

          function Add-GamDirectory {
              param(
                  [string]$PhysicalPath,
                  [string]$RelativePath,
                  [int]$Indent
              )

              $indentText = (" " * $Indent)

              $items = Get-ChildItem `
                -Path $PhysicalPath `
                -Force

              foreach ($item in $items) {

                  if ($item.PSIsContainer) {

                      $safe =
                        ($RelativePath + "\" + $item.Name) `
                        -replace '[^A-Za-z0-9]', '_'

                      $directoryId = "GAM7Dir_$safe"

                      $name =
                        [System.Security.SecurityElement]::Escape(
                            $item.Name
                        )

                      $lines.Add(
                          "$indentText<Directory Id=`"$directoryId`" Name=`"$name`">"
                      )

                      $newRelative = if ($RelativePath -eq "") {
                          $item.Name
                      }
                      else {
                          "$RelativePath\$($item.Name)"
                      }

                      Add-GamDirectory `
                        -PhysicalPath $item.FullName `
                        -RelativePath $newRelative `
                        -Indent ($Indent + 2)

                      $lines.Add(
                          "$indentText</Directory>"
                      )

                  }
                  else {

                      $script:counter++

                      $relative =
                        $item.FullName.Substring(
                            $gamPath.Length
                        ).TrimStart('\')

                      $safeFile =
                        $relative `
                        -replace '[^A-Za-z0-9]', '_'

                      $componentId =
                        "GAM7Component_$script:counter"

                      $fileId =
                        "GAM7File_$script:counter"

                      $source =
                        "`$(var.GAM7SourceDir)\$relative"

                      $lines.Add(
                          "$indentText<Component Id=`"$componentId`" Guid=`"*`">"
                      )

                      $lines.Add(
                          "$indentText  <File Id=`"$fileId`" KeyPath=`"yes`" Source=`"$source`" />"
                      )

                      $lines.Add(
                          "$indentText</Component>"
                      )

                      $componentRefs.Add($componentId)

                  }

              }
          }

          Add-GamDirectory `
            -PhysicalPath $gamPath `
            -RelativePath "" `
            -Indent 6

          $lines.Add('    </DirectoryRef>')
          $lines.Add('  </Fragment>')
          $lines.Add('')

          $lines.Add('  <Fragment>')
          $lines.Add('    <ComponentGroup Id="GAM7Files">')

          foreach ($component in $componentRefs) {

              $lines.Add(
                  "      <ComponentRef Id=`"$component`" />"
              )

          }

          $lines.Add('    </ComponentGroup>')
          $lines.Add('  </Fragment>')
          $lines.Add('</Wix>')

          $lines |
            Set-Content `
              -Path $wixFile `
              -Encoding UTF8

          Write-Host "GAM7Components.wxs created."
          Write-Host "Components generated: $($componentRefs.Count)"


      # ========================================
      # Verify GAM7 WiX
      # ========================================

      - name: Verify GAM7 WiX
        shell: powershell
        run: |

          $file = "$PWD\installer\GAM7Components.wxs"

          if (-not (Test-Path $file)) {

              Write-Host "ERROR: GAM7Components.wxs does not exist."
              exit 1

          }

          $content = Get-Content $file -Raw

          if ($content -notmatch 'ComponentGroup Id="GAM7Files"') {

              Write-Host "ERROR: GAM7 component group was not generated."
              exit 1

          }

          if ($content -notmatch 'GAM7Component_') {

              Write-Host "ERROR: GAM7 components were not generated."
              exit 1

          }

          Write-Host "GAM7 WiX verification successful."


      # ========================================
      # Build MSI
      # ========================================

      - name: Build MSI with WiX
        shell: powershell
        run: |

          $wix = $env:WIX_PATH
          $outputDir = Join-Path $PWD "installer-output"

          Write-Host "========================================"
          Write-Host "Building MSI"
          Write-Host "========================================"

          Write-Host "WiX:"
          Write-Host $wix

          Write-Host ""
          Write-Host "Compiling WiX files..."

          & "$wix\candle.exe" `
            "-dSourceDir=$PWD\AppSourceDir" `
            "-dGAM7SourceDir=$PWD\GAM7" `
            "-dAdminTrayToolOutputDir=$PWD\publish" `
            "-dProductVersion=$env:MSI_VERSION" `
            "-out" "$outputDir\" `
            "$PWD\installer\Product.wxs" `
            "$PWD\installer\components.wxs" `
            "$PWD\installer\GAM7Components.wxs"

          if ($LASTEXITCODE -ne 0) {

              Write-Host "ERROR: WiX candle.exe failed."
              exit $LASTEXITCODE

          }

          Write-Host "WiX compilation successful."

          $productObj =
            Join-Path $outputDir "Product.wixobj"

          $componentsObj =
            Join-Path $outputDir "components.wixobj"

          $gamObj =
            Join-Path $outputDir "GAM7Components.wixobj"

          if (-not (Test-Path $productObj)) {

              Write-Host "ERROR: Product.wixobj missing."
              exit 1

          }

          if (-not (Test-Path $componentsObj)) {

              Write-Host "ERROR: components.wixobj missing."
              exit 1

          }

          if (-not (Test-Path $gamObj)) {

              Write-Host "ERROR: GAM7Components.wixobj missing."
              exit 1

          }

          Write-Host ""
          Write-Host "Linking MSI..."

          & "$wix\light.exe" `
            -ext WixUtilExtension `
            -ext WixUIExtension `
            -out "$outputDir\AdminTrayTool-$env:MSI_VERSION.msi" `
            "$productObj" `
            "$componentsObj" `
            "$gamObj"

          if ($LASTEXITCODE -ne 0) {

              Write-Host "ERROR: WiX light.exe failed."
              exit $LASTEXITCODE

          }

          $msi = Join-Path `
            $outputDir `
            "AdminTrayTool-$env:MSI_VERSION.msi"

          if (-not (Test-Path $msi)) {

              Write-Host "ERROR: $($msi) was not created."
              exit 1

          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "MSI CREATED SUCCESSFULLY"
          Write-Host "========================================"
          Write-Host $msi


      # ========================================
      # Upload MSI artifact
      # ========================================

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdminTrayTool-MSI
          path: installer-output/AdminTrayTool-${{ env.MSI_VERSION }}.msi


      # ========================================
      # Upload portable ZIP
      # ========================================

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdminTrayTool-portable
          path: installer-output/AdminTrayTool-portable.zip


      # ========================================
      # Upload publish folder
      # ========================================

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: AdminTrayTool-publish
          path: publish


      # ========================================
      # Create GitHub Release
      # ========================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/AdminTrayTool-${{ env.MSI_VERSION }}.msi
            installer-output/AdminTrayTool-portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}