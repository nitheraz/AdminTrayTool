name: Build MSI

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest

    steps:

    # ========================================
    # Checkout
    # ========================================
    - name: Checkout
      uses: actions/checkout@v4


    # ========================================
    # Setup .NET 10
    # ========================================
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'


    # ========================================
    # Restore
    # ========================================
    - name: Restore NuGet
      run: dotnet restore


    # ========================================
    # Build
    # ========================================
    - name: Build Release
      run: dotnet build -c Release --no-restore


    # ========================================
    # Publish
    # ========================================
    - name: Publish win-x64
      run: |
        dotnet publish `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -o publish


    # ========================================
    # Copy config.json
    # ========================================
    - name: Copy config.json
      shell: powershell
      run: |
        $src = "$PWD\config.json"
        $dst = "$PWD\publish\config.json"

        if (Test-Path $src) {
          Copy-Item `
            -Path $src `
            -Destination $dst `
            -Force

          Write-Host "config.json copied to publish folder."
        }
        else {
          Write-Host "WARNING: config.json was not found."
        }


    # ========================================
    # Verify GAM7
    # ========================================
    - name: Verify GAM7
      shell: powershell
      run: |

        $gamPath = "$PWD\GAM7"

        Write-Host "Checking GAM7 folder..."
        Write-Host $gamPath

        if (-not (Test-Path $gamPath)) {
          Write-Host "ERROR: GAM7 folder was not found."
          exit 1
        }

        $gamExe = "$gamPath\gam.exe"

        if (-not (Test-Path $gamExe)) {
          Write-Host "ERROR: gam.exe was not found."
          exit 1
        }

        Write-Host "GAM7 found successfully."
        Write-Host "gam.exe:"
        Write-Host $gamExe

        Write-Host ""
        Write-Host "GAM7 files:"

        Get-ChildItem `
          -Path $gamPath `
          -Recurse |
          ForEach-Object {
            Write-Host $_.FullName
          }


    # ========================================
    # Create MSI SourceDir
    # ========================================
    - name: Prepare MSI SourceDir
      shell: powershell
      run: |

        $sourceDir = "$PWD\SourceDir"

        if (Test-Path $sourceDir) {
          Remove-Item `
            -Path $sourceDir `
            -Recurse `
            -Force
        }

        New-Item `
          -ItemType Directory `
          -Force `
          -Path $sourceDir |
          Out-Null

        Write-Host "SourceDir created."


    # ========================================
    # Copy published application
    # ========================================
    - name: Copy application to SourceDir
      shell: powershell
      run: |

        Copy-Item `
          -Path "$PWD\publish\*" `
          -Destination "$PWD\SourceDir" `
          -Recurse `
          -Force

        Write-Host "Published application copied to SourceDir."


    # ========================================
    # Copy GAM7 to SourceDir
    # ========================================
    - name: Copy GAM7 to SourceDir
      shell: powershell
      run: |

        $gamDestination = "$PWD\SourceDir\GAM7"

        New-Item `
          -ItemType Directory `
          -Force `
          -Path $gamDestination |
          Out-Null

        Copy-Item `
          -Path "$PWD\GAM7\*" `
          -Destination $gamDestination `
          -Recurse `
          -Force

        Write-Host "GAM7 copied to SourceDir."


    # ========================================
    # Verify MSI SourceDir
    # ========================================
    - name: Verify MSI SourceDir
      shell: powershell
      run: |

        Write-Host "========================================"
        Write-Host "MSI SourceDir contents"
        Write-Host "========================================"

        Get-ChildItem `
          -Path "$PWD\SourceDir" `
          -Recurse |
          ForEach-Object {
            Write-Host $_.FullName
          }


    # ========================================
    # Create installer output directory
    # ========================================
    - name: Create installer output directory
      shell: powershell
      run: |

        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$PWD\installer-output" |
          Out-Null

        Write-Host "installer-output directory created."


    # ========================================
    # Create portable ZIP
    # ========================================
    - name: Create portable ZIP
      shell: powershell
      run: |

        $zip = "$PWD\installer-output\AdminTrayTool-portable.zip"

        if (Test-Path $zip) {
          Remove-Item `
            $zip `
            -Force
        }

        Compress-Archive `
          -Path "$PWD\publish\*" `
          -DestinationPath $zip `
          -Force

        if (-not (Test-Path $zip)) {
          Write-Host "ERROR: Portable ZIP was not created."
          exit 1
        }

        Write-Host "Portable ZIP created successfully."


    # ========================================
    # Locate WiX Toolset
    # ========================================
    - name: Locate WiX Toolset
      shell: powershell
      run: |

        Write-Host "Searching for WiX Toolset..."

        $candle = Get-ChildItem `
          -Path "C:\Program Files (x86)" `
          -Filter "candle.exe" `
          -Recurse `
          -ErrorAction SilentlyContinue |
          Select-Object -First 1

        if (-not $candle) {

          $candle = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "candle.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

        }

        if (-not $candle) {
          Write-Host "ERROR: candle.exe was not found."
          exit 1
        }

        $wix = $candle.Directory.FullName

        Write-Host "WiX Toolset found at:"
        Write-Host $wix

        $required = @(
          "candle.exe",
          "light.exe",
          "heat.exe"
        )

        foreach ($file in $required) {

          $path = Join-Path $wix $file

          if (-not (Test-Path $path)) {
            Write-Host "ERROR: $file was not found."
            exit 1
          }

          Write-Host "Found: $path"
        }

        "WIX_PATH=$wix" |
          Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

        Write-Host "WiX Toolset is ready."


    # ========================================
    # Harvest publish folder
    # ========================================
    - name: Harvest application with Heat
      shell: powershell
      run: |

        $wix = "$env:WIX_PATH"

        Write-Host "Harvesting application files..."

        & "$wix\heat.exe" `
          dir "$PWD\SourceDir" `
          -cg AppFiles `
          -dr INSTALLFOLDER `
          -gg `
          -sfrag `
          -srd `
          -x GAM7 `
          -var var.SourceDir `
          -out "$PWD\installer\components.wxs"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: Application Heat failed."
          exit $LASTEXITCODE
        }

        if (-not (Test-Path "$PWD\installer\components.wxs")) {
          Write-Host "ERROR: components.wxs was not created."
          exit 1
        }

        Write-Host "Application components.wxs created."


    # ========================================
    # Harvest GAM7 folder
    # ========================================
    - name: Harvest GAM7 with Heat
      shell: powershell
      run: |

        $wix = "$env:WIX_PATH"

        Write-Host "Harvesting GAM7 files..."

        & "$wix\heat.exe" `
          dir "$PWD\SourceDir\GAM7" `
          -cg GAM7Files `
          -dr GAM7Folder `
          -gg `
          -sfrag `
          -srd `
          -var var.GAM7SourceDir `
          -out "$PWD\installer\GAM7Components.wxs"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: GAM7 Heat failed."
          exit $LASTEXITCODE
        }

        if (-not (Test-Path "$PWD\installer\GAM7Components.wxs")) {
          Write-Host "ERROR: GAM7Components.wxs was not created."
          exit 1
        }

        Write-Host "GAM7Components.wxs created successfully."


    # ========================================
    # Determine MSI version
    # ========================================
    - name: Determine MSI version
      shell: powershell
      run: |

        if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {
          $version = $Matches[1]
        }
        else {
          $version = "1.0.0"
        }

        Write-Host "MSI Version: $version"

        "MSI_VERSION=$version" |
          Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8


    # ========================================
    # Build MSI
    # ========================================
    - name: Build MSI with WiX
      shell: powershell
      run: |

        $wix = "$env:WIX_PATH"
        $outputDir = "$PWD\installer-output"

        Write-Host "Using WiX from:"
        Write-Host $wix

        Write-Host "Compiling WiX source files..."

        & "$wix\candle.exe" `
          -dSourceDir="$PWD\SourceDir" `
          -dGAM7SourceDir="$PWD\SourceDir\GAM7" `
          -dAdminTrayToolOutputDir="$PWD\publish" `
          -dProductVersion="$env:MSI_VERSION" `
          -out "$outputDir\" `
          "installer\Product.wxs" `
          "installer\components.wxs" `
          "installer\GAM7Components.wxs"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: WiX candle.exe failed."
          exit $LASTEXITCODE
        }

        Write-Host "WiX compilation successful."

        $productObj = "$outputDir\Product.wixobj"
        $componentsObj = "$outputDir\components.wixobj"
        $gamObj = "$outputDir\GAM7Components.wixobj"

        if (-not (Test-Path $productObj)) {
          Write-Host "ERROR: Product.wixobj was not created."
          exit 1
        }

        if (-not (Test-Path $componentsObj)) {
          Write-Host "ERROR: components.wixobj was not created."
          exit 1
        }

        if (-not (Test-Path $gamObj)) {
          Write-Host "ERROR: GAM7Components.wixobj was not created."
          exit 1
        }

        Write-Host "Linking MSI..."

        & "$wix\light.exe" `
          -ext WixUtilExtension `
          -ext WixUIExtension `
          -out "$outputDir\AdminTrayTool.msi" `
          "$productObj" `
          "$componentsObj" `
          "$gamObj"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: WiX light.exe failed."
          exit $LASTEXITCODE
        }

        $msi = "$outputDir\AdminTrayTool.msi"

        if (-not (Test-Path $msi)) {
          Write-Host "ERROR: AdminTrayTool.msi was not created."
          exit 1
        }

        Write-Host "========================================"
        Write-Host "MSI created successfully!"
        Write-Host $msi
        Write-Host "========================================"


    # ========================================
    # Upload MSI artifact
    # ========================================
    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-msi
        path: installer-output/AdminTrayTool.msi


    # ========================================
    # Upload portable ZIP artifact
    # ========================================
    - name: Upload portable ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-portable
        path: installer-output/AdminTrayTool-portable.zip


    # ========================================
    # Upload published application
    # ========================================
    - name: Upload published application
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-publish
        path: publish


    # ========================================
    # Create GitHub Release
    # ========================================
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          installer-output/AdminTrayTool.msi
          installer-output/AdminTrayTool-portable.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}