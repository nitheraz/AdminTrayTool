name: Build MSI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest

    steps:

    # ========================================
    # Checkout
    # ========================================
    - name: Checkout
      uses: actions/checkout@v4


    # ========================================
    # Setup .NET 10
    # ========================================
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'


    # ========================================
    # Restore
    # ========================================
    - name: Restore NuGet
      run: dotnet restore


    # ========================================
    # Build
    # ========================================
    - name: Build Release
      run: dotnet build -c Release --no-restore


    # ========================================
    # Publish
    # ========================================
    - name: Publish win-x64
      run: |
        dotnet publish `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -o publish


    # ========================================
    # Copy config.json
    # ========================================
    - name: Copy config.json
      shell: powershell
      run: |
        $src = "$PWD\config.json"
        $dst = "$PWD\publish\config.json"

        if (Test-Path $src) {
          Copy-Item -Path $src -Destination $dst -Force
          Write-Host "config.json copied to publish folder."
        }
        else {
          Write-Host "WARNING: config.json was not found."
        }


    # ========================================
    # Create installer output directory
    # ========================================
    - name: Create installer output directory
      shell: powershell
      run: |
        New-Item `
          -ItemType Directory `
          -Force `
          -Path "$PWD\installer-output" |
          Out-Null

        Write-Host "installer-output directory created."


    # ========================================
    # Create portable ZIP
    # ========================================
    - name: Create portable ZIP
      shell: powershell
      run: |
        $zip = "$PWD\installer-output\AdminTrayTool-portable.zip"

        if (Test-Path $zip) {
          Remove-Item $zip -Force
        }

        Compress-Archive `
          -Path "$PWD\publish\*" `
          -DestinationPath $zip `
          -Force

        if (-not (Test-Path $zip)) {
          Write-Host "ERROR: Portable ZIP was not created."
          exit 1
        }

        Write-Host "Portable ZIP created successfully."


    # ========================================
    # Locate WiX Toolset
    # ========================================
    - name: Locate WiX Toolset
      shell: powershell
      run: |
        Write-Host "Searching for WiX Toolset..."

        $candle = Get-ChildItem `
          -Path "C:\Program Files (x86)" `
          -Filter "candle.exe" `
          -Recurse `
          -ErrorAction SilentlyContinue |
          Select-Object -First 1

        if (-not $candle) {
          $candle = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "candle.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1
        }

        if (-not $candle) {
          Write-Host "ERROR: candle.exe was not found."
          exit 1
        }

        $wix = $candle.Directory.FullName

        Write-Host "WiX Toolset found at:"
        Write-Host $wix

        $required = @(
          "candle.exe",
          "light.exe",
          "heat.exe"
        )

        foreach ($file in $required) {

          $path = Join-Path $wix $file

          if (-not (Test-Path $path)) {
            Write-Host "ERROR: $file was not found."
            exit 1
          }

          Write-Host "Found: $path"
        }

        "WIX_PATH=$wix" |
          Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

        Write-Host "WiX Toolset is ready."


    # ========================================
    # Harvest publish folder
    # ========================================
    - name: Harvest publish folder with Heat
      shell: powershell
      run: |
        $wix = "$env:WIX_PATH"

        Write-Host "Using WiX from:"
        Write-Host $wix

        if (-not (Test-Path "$PWD\publish")) {
          Write-Host "ERROR: publish folder does not exist."
          exit 1
        }

        & "$wix\heat.exe" `
          dir "$PWD\publish" `
          -cg AppFiles `
          -dr INSTALLFOLDER `
          -gg `
          -sfrag `
          -srd `
          -var var.SourceDir `
          -out "installer\components.wxs"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: Heat failed."
          exit $LASTEXITCODE
        }

        if (-not (Test-Path "$PWD\installer\components.wxs")) {
          Write-Host "ERROR: components.wxs was not created."
          exit 1
        }

        Write-Host "components.wxs created successfully."


    # ========================================
    # Build MSI
    # ========================================
    - name: Build MSI with WiX
      shell: powershell
      run: |
        $wix = "$env:WIX_PATH"
        $outputDir = "$PWD\installer-output"

        Write-Host "Using WiX from:"
        Write-Host $wix

        Write-Host "Compiling WiX source files..."

        & "$wix\candle.exe" `
          -dSourceDir="$PWD\publish" `
          -dAdminTrayToolOutputDir="$PWD\publish" `
          -out "$outputDir\" `
          "installer\Product.wxs" `
          "installer\components.wxs"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: WiX candle.exe failed."
          exit $LASTEXITCODE
        }

        Write-Host "WiX compilation successful."

        $productObj = "$outputDir\Product.wixobj"
        $componentsObj = "$outputDir\components.wixobj"

        if (-not (Test-Path $productObj)) {
          Write-Host "ERROR: Product.wixobj was not created."
          exit 1
        }

        if (-not (Test-Path $componentsObj)) {
          Write-Host "ERROR: components.wixobj was not created."
          exit 1
        }

        Write-Host "Linking MSI..."

        & "$wix\light.exe" `
          -ext WixUtilExtension `
          -out "$outputDir\AdminTrayTool.msi" `
          "$productObj" `
          "$componentsObj"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: WiX light.exe failed."
          exit $LASTEXITCODE
        }

        $msi = "$outputDir\AdminTrayTool.msi"

        if (-not (Test-Path $msi)) {
          Write-Host "ERROR: AdminTrayTool.msi was not created."
          exit 1
        }

        Write-Host "========================================"
        Write-Host "MSI created successfully!"
        Write-Host $msi
        Write-Host "========================================"


    # ========================================
    # Upload MSI artifact
    # ========================================
    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-msi
        path: installer-output/AdminTrayTool.msi


    # ========================================
    # Upload portable ZIP artifact
    # ========================================
    - name: Upload portable ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-portable
        path: installer-output/AdminTrayTool-portable.zip


    # ========================================
    # Upload published application
    # ========================================
    - name: Upload published application
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-publish
        path: publish
