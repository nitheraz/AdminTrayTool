name: Build MSI

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest

    steps:

    # ========================================
    # Checkout
    # ========================================
    - name: Checkout
      uses: actions/checkout@v4


    # ========================================
    # Setup .NET 10
    # ========================================
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'


    # ========================================
    # Restore
    # ========================================
    - name: Restore NuGet
      run: dotnet restore


    # ========================================
    # Build
    # ========================================
    - name: Build Release
      run: dotnet build -c Release --no-restore


    # ========================================
    # Publish
    # ========================================
    - name: Publish win-x64
      shell: powershell
      run: |
        dotnet publish `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -o publish


    # ========================================
    # Copy config.json
    # ========================================
    - name: Copy config.json
      shell: powershell
      run: |

        $src = "$PWD\config.json"
        $dst = "$PWD\publish\config.json"

        if (Test-Path $src) {

          Copy-Item `
            -Path $src `
            -Destination $dst `
            -Force

          Write-Host "config.json copied to publish folder."

        }
        else {

          Write-Host "WARNING: config.json was not found."

        }


    # ========================================
    # Verify GAM7
    # ========================================
    - name: Verify GAM7
      shell: powershell
      run: |

        $gamPath = "$PWD\GAM7"

        Write-Host "========================================"
        Write-Host "Checking GAM7"
        Write-Host "========================================"

        if (-not (Test-Path $gamPath)) {
          Write-Host "ERROR: GAM7 folder was not found."
          exit 1
        }

        $gamExe = "$gamPath\gam.exe"

        if (-not (Test-Path $gamExe)) {
          Write-Host "ERROR: GAM7\gam.exe was not found."
          exit 1
        }

        Write-Host "GAM7 found successfully."
        Write-Host "gam.exe: $gamExe"

        $gamFiles = Get-ChildItem `
          -Path $gamPath `
          -Recurse `
          -File

        Write-Host "GAM7 file count: $($gamFiles.Count)"


    # ========================================
    # Prepare MSI application source
    #
    # IMPORTANT:
    # publish may contain GAM7 because the
    # project copies GAM7 during publish.
    #
    # We therefore copy publish to a separate
    # AppSourceDir and REMOVE GAM7.
    # ========================================
    - name: Prepare AppSourceDir
      shell: powershell
      run: |

        $appSourceDir = "$PWD\AppSourceDir"

        Write-Host "========================================"
        Write-Host "Preparing AppSourceDir"
        Write-Host "========================================"

        if (Test-Path $appSourceDir) {

          Remove-Item `
            -Path $appSourceDir `
            -Recurse `
            -Force

        }

        New-Item `
          -ItemType Directory `
          -Path $appSourceDir `
          -Force |
          Out-Null

        Copy-Item `
          -Path "$PWD\publish\*" `
          -Destination $appSourceDir `
          -Recurse `
          -Force

        $appGamPath = "$appSourceDir\GAM7"

        if (Test-Path $appGamPath) {

          Remove-Item `
            -Path $appGamPath `
            -Recurse `
            -Force

          Write-Host "Removed GAM7 from AppSourceDir."

        }

        Write-Host "AppSourceDir prepared."


    # ========================================
    # Verify AppSourceDir
    # ========================================
    - name: Verify AppSourceDir
      shell: powershell
      run: |

        Write-Host "========================================"
        Write-Host "Verifying AppSourceDir"
        Write-Host "========================================"

        if (Test-Path "$PWD\AppSourceDir\GAM7") {

          Write-Host "ERROR: GAM7 still exists in AppSourceDir."
          exit 1

        }

        Write-Host "Confirmed: GAM7 is NOT in AppSourceDir."

        Write-Host ""
        Write-Host "Application files:"

        Get-ChildItem `
          -Path "$PWD\AppSourceDir" `
          -Recurse `
          -File |
          ForEach-Object {

            Write-Host $_.FullName

          }


    # ========================================
    # Create installer output directory
    # ========================================
    - name: Create installer output directory
      shell: powershell
      run: |

        New-Item `
          -ItemType Directory `
          -Path "$PWD\installer-output" `
          -Force |
          Out-Null

        Write-Host "installer-output directory created."


    # ========================================
    # Create portable ZIP
    #
    # publish is intentionally used here
    # because it contains GAM7.
    # ========================================
    - name: Create portable ZIP
      shell: powershell
      run: |

        $zip = "$PWD\installer-output\AdminTrayTool-portable.zip"

        if (Test-Path $zip) {

          Remove-Item `
            -Path $zip `
            -Force

        }

        Compress-Archive `
          -Path "$PWD\publish\*" `
          -DestinationPath $zip `
          -Force

        if (-not (Test-Path $zip)) {

          Write-Host "ERROR: Portable ZIP was not created."
          exit 1

        }

        Write-Host "Portable ZIP created successfully."


    # ========================================
    # Locate WiX Toolset
    # ========================================
    - name: Locate WiX Toolset
      shell: powershell
      run: |

        Write-Host "========================================"
        Write-Host "Locating WiX Toolset"
        Write-Host "========================================"

        $candle = Get-ChildItem `
          -Path "C:\Program Files (x86)" `
          -Filter "candle.exe" `
          -Recurse `
          -ErrorAction SilentlyContinue |
          Select-Object -First 1

        if (-not $candle) {

          $candle = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "candle.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

        }

        if (-not $candle) {

          Write-Host "ERROR: candle.exe was not found."
          exit 1

        }

        $wix = $candle.Directory.FullName

        Write-Host "WiX Toolset:"
        Write-Host $wix

        $required = @(
          "candle.exe",
          "light.exe",
          "heat.exe"
        )

        foreach ($file in $required) {

          $path = Join-Path $wix $file

          if (-not (Test-Path $path)) {

            Write-Host "ERROR: $file was not found."
            exit 1

          }

          Write-Host "Found: $path"

        }

        "WIX_PATH=$wix" |
          Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

        Write-Host "WiX Toolset ready."


    # ========================================
    # Harvest APPLICATION
    #
    # IMPORTANT:
    # This uses AppSourceDir, NOT publish.
    #
    # This guarantees GAM7 is not harvested
    # with the application.
    # ========================================
    - name: Harvest application with Heat
      shell: powershell
      run: |

        $wix = "$env:WIX_PATH"
        $source = "$PWD\AppSourceDir"

        Write-Host "========================================"
        Write-Host "Harvesting application"
        Write-Host "========================================"

        if (-not (Test-Path $source)) {

          Write-Host "ERROR: AppSourceDir does not exist."
          exit 1

        }

        if (Test-Path "$source\GAM7") {

          Write-Host "ERROR: GAM7 was found in AppSourceDir."
          exit 1

        }

        & "$wix\heat.exe" `
          dir "$source" `
          -cg AppFiles `
          -dr INSTALLFOLDER `
          -gg `
          -sfrag `
          -srd `
          -sreg `
          -var var.SourceDir `
          -out "$PWD\installer\components.wxs"

        if ($LASTEXITCODE -ne 0) {

          Write-Host "ERROR: Application Heat failed."
          exit $LASTEXITCODE

        }

        if (-not (Test-Path "$PWD\installer\components.wxs")) {

          Write-Host "ERROR: components.wxs was not created."
          exit 1

        }

        Write-Host "Application components.wxs created."


    # ========================================
    # Harvest GAM7
    # ========================================
    - name: Harvest GAM7 with Heat
      shell: powershell
      run: |

        $wix = "$env:WIX_PATH"
        $gamPath = "$PWD\GAM7"

        Write-Host "========================================"
        Write-Host "Harvesting GAM7"
        Write-Host "========================================"

        if (-not (Test-Path "$gamPath\gam.exe")) {
          Write-Host "ERROR: GAM7\gam.exe was not found."
          exit 1
        }

        # Create a temporary GAM7 harvest directory.
        #
        # We exclude directories that contain files which
        # cause WiX ICE30 duplicate-component problems.
        $gamHarvestPath = "$PWD\GAM7Harvest"

        if (Test-Path $gamHarvestPath) {
          Remove-Item `
            -Path $gamHarvestPath `
            -Recurse `
            -Force
        }

        New-Item `
          -ItemType Directory `
          -Path $gamHarvestPath `
          -Force |
          Out-Null

        Write-Host "Copying GAM7 files for harvesting..."

        # Copy GAM7 while excluding problematic directories.
        Get-ChildItem `
          -Path $gamPath `
          -Force |
          Where-Object {
            $_.Name -notin @(
              "__pycache__"
            )
          } |
          ForEach-Object {

            Copy-Item `
              -Path $_.FullName `
              -Destination $gamHarvestPath `
              -Recurse `
              -Force

          }

        # Remove problematic package/license files.
        #
        # These are not required for GAM execution and can
        # generate duplicate component references in WiX.
        Get-ChildItem `
          -Path $gamHarvestPath `
          -Recurse `
          -File `
          -ErrorAction SilentlyContinue |
          Where-Object {
            $_.Name -in @(
              "COPYING",
              "copying",
              "COPYING.txt",
              "LICENSE",
              "license"
            )
          } |
          ForEach-Object {

            Write-Host "Removing license file: $($_.FullName)"

            Remove-Item `
              -Path $_.FullName `
              -Force

          }

        # Remove timezone database.
        $tzdataPath = Get-ChildItem `
          -Path $gamHarvestPath `
          -Directory `
          -Recurse `
          -ErrorAction SilentlyContinue |
          Where-Object {
            $_.Name -eq "tzdata"
          }

        foreach ($folder in $tzdataPath) {

          Write-Host "Removing tzdata directory: $($folder.FullName)"

          Remove-Item `
            -Path $folder.FullName `
            -Recurse `
            -Force

        }

        Write-Host ""
        Write-Host "GAM7 harvest source prepared."

        Write-Host ""
        Write-Host "Running Heat..."

        & "$wix\heat.exe" `
          dir "$gamHarvestPath" `
          -cg GAM7Files `
          -dr GAM7Folder `
          -gg `
          -sfrag `
          -srd `
          -sreg `
          -var var.GAM7SourceDir `
          -out "$PWD\installer\GAM7Components.wxs"

        if ($LASTEXITCODE -ne 0) {
          Write-Host "ERROR: GAM7 Heat failed."
          exit $LASTEXITCODE
        }

        if (-not (Test-Path "$PWD\installer\GAM7Components.wxs")) {
          Write-Host "ERROR: GAM7Components.wxs was not created."
          exit 1
        }

        Write-Host ""
        Write-Host "GAM7Components.wxs created successfully."

    # ========================================
    # Verify harvested WiX files
    # ========================================
    - name: Verify harvested WiX files
      shell: powershell
      run: |

        Write-Host "========================================"
        Write-Host "Verifying harvested WiX files"
        Write-Host "========================================"

        $appFile = "$PWD\installer\components.wxs"
        $gamFile = "$PWD\installer\GAM7Components.wxs"

        if (-not (Test-Path $appFile)) {

          Write-Host "ERROR: components.wxs missing."
          exit 1

        }

        if (-not (Test-Path $gamFile)) {

          Write-Host "ERROR: GAM7Components.wxs missing."
          exit 1

        }

        $appComponents = Get-Content `
          $appFile `
          -Raw

        $gamComponents = Get-Content `
          $gamFile `
          -Raw

        Write-Host ""
        Write-Host "Checking application harvest..."

        if ($appComponents -match '(?i)GAM7') {

          Write-Host "ERROR: GAM7 was found in components.wxs."
          exit 1

        }

        Write-Host "Application harvest is clean."

        Write-Host ""
        Write-Host "Checking GAM7 harvest..."

        if ($gamComponents -notmatch '(?i)gam\.exe') {

          Write-Host "ERROR: gam.exe was not found in GAM7Components.wxs."
          exit 1

        }

        Write-Host "GAM7 harvest contains gam.exe."

        Write-Host ""
        Write-Host "Harvest verification successful."


    # ========================================
    # Determine MSI version
    # ========================================
    - name: Determine MSI version
      shell: powershell
      run: |

        if ("${{ github.ref }}" -match "^refs/tags/v(.+)$") {

          $version = $Matches[1]

        }
        else {

          $version = "1.0.0"

        }

        Write-Host "MSI Version: $version"

        "MSI_VERSION=$version" |
          Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8


    # ========================================
    # Build MSI
    # ========================================
    - name: Build MSI with WiX
      shell: powershell
      run: |

        $wix = "$env:WIX_PATH"
        $outputDir = "$PWD\installer-output"

        Write-Host "========================================"
        Write-Host "Building MSI"
        Write-Host "========================================"

        Write-Host ""
        Write-Host "Using WiX:"
        Write-Host $wix

        Write-Host ""
        Write-Host "Compiling WiX files..."

        & "$wix\candle.exe" `
          -dSourceDir="$PWD\AppSourceDir" `
          -dGAM7SourceDir="$PWD\GAM7Harvest"
          -dAdminTrayToolOutputDir="$PWD\publish" `
          -dProductVersion="$env:MSI_VERSION" `
          -out "$outputDir\" `
          "installer\Product.wxs" `
          "installer\components.wxs" `
          "installer\GAM7Components.wxs"

        if ($LASTEXITCODE -ne 0) {

          Write-Host "ERROR: WiX candle.exe failed."
          exit $LASTEXITCODE

        }

        Write-Host "WiX compilation successful."

        $productObj = "$outputDir\Product.wixobj"
        $componentsObj = "$outputDir\components.wixobj"
        $gamObj = "$outputDir\GAM7Components.wixobj"

        if (-not (Test-Path $productObj)) {

          Write-Host "ERROR: Product.wixobj was not created."
          exit 1

        }

        if (-not (Test-Path $componentsObj)) {

          Write-Host "ERROR: components.wixobj was not created."
          exit 1

        }

        if (-not (Test-Path $gamObj)) {

          Write-Host "ERROR: GAM7Components.wixobj was not created."
          exit 1

        }

        Write-Host ""
        Write-Host "Linking MSI..."

        & "$wix\light.exe" `
          -ext WixUtilExtension `
          -ext WixUIExtension `
          -out "$outputDir\AdminTrayTool.msi" `
          "$productObj" `
          "$componentsObj" `
          "$gamObj"

        if ($LASTEXITCODE -ne 0) {

          Write-Host "ERROR: WiX light.exe failed."
          exit $LASTEXITCODE

        }

        $msi = "$outputDir\AdminTrayTool.msi"

        if (-not (Test-Path $msi)) {

          Write-Host "ERROR: AdminTrayTool.msi was not created."
          exit 1

        }

        Write-Host ""
        Write-Host "========================================"
        Write-Host "MSI CREATED SUCCESSFULLY"
        Write-Host "========================================"
        Write-Host $msi


    # ========================================
    # Upload MSI artifact
    # ========================================
    - name: Upload MSI artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-msi
        path: installer-output/AdminTrayTool.msi


    # ========================================
    # Upload portable ZIP
    # ========================================
    - name: Upload portable ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-portable
        path: installer-output/AdminTrayTool-portable.zip


    # ========================================
    # Upload published application
    # ========================================
    - name: Upload published application
      uses: actions/upload-artifact@v4
      with:
        name: AdminTrayTool-publish
        path: publish


    # ========================================
    # Create GitHub Release
    # ========================================
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          installer-output/AdminTrayTool.msi
          installer-output/AdminTrayTool-portable.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}